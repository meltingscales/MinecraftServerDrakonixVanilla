# Tracked, curated subset - copied to the live server only if one doesn't
# already exist there (see `just deploy`), so hand-edits on the live server
# (e.g. via /gamerule) are never clobbered by a redeploy. Vanilla fills in
# every other key with its own defaults on first boot.
server-port=25568
query.port=25568

motd=Milo's Minecraft World
difficulty=easy
gamemode=survival
max-players=10
view-distance=10
simulation-distance=10
spawn-protection=16
pvp=false
online-mode=true
white-list=true
enforce-whitelist=true
